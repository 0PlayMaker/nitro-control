PACKAGE_NAME="nitro-kbd-timeout"
PACKAGE_VERSION="1.0"
MAKE[0]="make KERNELDIR=/lib/modules/${kernelver}/build"
# No CLEAN= here: dkms 3.x deprecated it and removes the build tree itself.
# The Makefile still has a clean target for standalone builds.
BUILT_MODULE_NAME[0]="nitro_kbd_timeout"
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86"
AUTOINSTALL="yes"
